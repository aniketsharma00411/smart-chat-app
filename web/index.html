<!DOCTYPE html>
<html>

  <head>
    <!--

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of

  -->

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Vayu - Global Team Bridge">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Vayu">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Vayu</title>
    <link rel="manifest" href="manifest.json">
  </head>

  <body>
    <!-- Intercept getUserMedia to track MediaStreams -->
    <script>
      (function () {
        const originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        window._activeMediaStreams = [];

        navigator.mediaDevices.getUserMedia = function (constraints) {
          console.log('🎤 getUserMedia called with:', constraints);
          return originalGetUserMedia(constraints).then((stream) => {
            console.log('✅ MediaStream obtained:', stream.id);
            window._activeMediaStreams.push(stream);
            return stream;
          });
        };

        window.stopAllMediaStreams = function () {
          console.log('🛑 Stopping all media streams...', window._activeMediaStreams.length);
          window._activeMediaStreams.forEach((stream, index) => {
            stream.getTracks().forEach(track => {
              console.log(`🛑 Stopping track ${index}:`, track.kind, track.label, track.readyState);
              track.stop();
            });
          });
          window._activeMediaStreams = [];
          console.log('✅ All media streams stopped');
        };
      })();
    </script>

    <script src="flutter_bootstrap.js" async></script>
  </body>

</html>
