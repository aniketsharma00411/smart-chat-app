name: vayu
description: Vayu uses Gemini 3 to bridge global teams with real-time translation and tone analysis.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_sign_in: ^6.2.1
  http: ^1.1.2
  flutter_riverpod: ^3.2.0
  go_router: ^17.0.1
  intl: ^0.20.2
  google_fonts: ^8.0.0
  permission_handler: ^11.0.0
  audioplayers: ^6.0.0
  web_socket_channel: ^3.0.0
  flutter_dotenv: ^5.0.0
  flutter_sound: ^9.2.13


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0175C2"
    theme_color: "#0175C2"
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"


flutter:
  uses-material-design: true
  assets:
     - .env
     - assets/branding/
